# I05 正式训练清单：25 个 run（5 癌 × 5 seed），arm e0_bcmbert200 = E0/NPJ-C 骨架 + BioClinical ModernBERT 嵌入版 Text 特征。
# 与既有 e0 臂唯一的科学差异是 --model-config 指向 experiments/I05_text_encoder_bcmbert/model_config.yml；训练超参沿用 launcher 默认（坑 D16）。
# 按 seed 主序排列（同一 seed 内五癌各一次），配合总槽位 ≤ 5，可降低同癌种并发初始化 dataset 的概率，但不能保证杜绝（坑 D15 残余竞态；训练后须复验缓存摘要）。
# 发车须从 main 冻结的 run worktree 经 jobrun.sh 托管，并使用独立的 --result-path / --state-file。
runs:
  - name: e0_bcmbert200_LGG_s123
    arm: e0_bcmbert200
    network_type: NPJC
    compensator: none
    cancer: LGG
    seed: 123
    bin_mode: author
