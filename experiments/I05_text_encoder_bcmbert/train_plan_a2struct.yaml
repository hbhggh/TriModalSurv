# I06 正式训练清单：25 个 run（5 癌 × 5 seed），arm e0_a2struct = E0/NPJ-C 骨架 + Qwen3-Embedding + LLM 结构化抽取（A2-S） 的 Text 特征。
# 与 B1（e0_bcmbert200）清单的差异只有 --model-config 指向 model_config_a2struct.yml 与 extra_args --skip_test（坑 D16）。
# --skip_test：训练阶段不在 test 上预测、不写 test 产物；正式 test 只由评测器在终点跑一次（研究计划书 4.8）。
# 发车须从 main 冻结的 run worktree 经 jobrun.sh 托管，使用独立的 --result-path / --state-file；不得启用 --eval_grids。
runs:
  - name: e0_a2struct_LGG_s123
    arm: e0_a2struct
    network_type: NPJC
    compensator: none
    cancer: LGG
    seed: 123
    bin_mode: author
    extra_args: --skip_test
