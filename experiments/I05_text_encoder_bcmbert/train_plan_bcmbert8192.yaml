# I05 A0 正式训练清单：25 个 run（5 癌 × 5 seed），arm e0_bcmbert8192 = E0/NPJ-C 骨架 + BioClinical ModernBERT 嵌入版全文（≤8192 token）Text 特征。
# 与 bcmbert200（轮 C）唯一的科学差异是特征的上下文长度；与既有 e0 臂的差异只在 --model-config（experiments/I05_text_encoder_bcmbert/model_config_bcmbert8192.yml）。训练超参沿用 launcher 默认（坑 D16）。
# 按 seed 主序排列，配合总槽位 ≤ 5，降低同癌种并发初始化 dataset 的概率（坑 D15 残余竞态；训练后复验缓存摘要）。
# 正式发车须从 main 冻结的 run worktree 经 jobrun.sh 托管，并使用独立的 --result-path / --state-file（ckpt 文件名与其他 Text 档案相同）。
runs:
  - name: e0_bcmbert8192_LGG_s123
    arm: e0_bcmbert8192
    network_type: NPJC
    compensator: none
    cancer: LGG
    seed: 123
    bin_mode: author
